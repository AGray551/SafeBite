<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e00122" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash light.
      // PreferencesProvider takes over once React mounts.
      try {
        var theme = (JSON.parse(localStorage.getItem('safebite.preferences')) || {}).theme;
        if (theme === 'bearcat-red') theme = 'dark';
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="SafeBite helps University of Cincinnati students find dining hall food that is safe for their allergies and dietary needs."
    />
    <title>SafeBite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
